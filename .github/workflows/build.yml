name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy file ZIP"
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          echo "Nội dung sau khi giải nén:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Gradle project
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "Không tìm thấy settings.gradle"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTokTaskOverlay-APK
          path: |
            **/build/outputs/apk/debug/*.apk
